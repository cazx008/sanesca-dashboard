name: Despacho Matutino de Telemetria (WhatsApp)

on:
  # Cron migrado a Cloudflare Worker (sanesca-telegram-bot) para evitar retrasos de cola en GitHub Actions
  # y colisión 409 con el webhook de Telegram.
  # schedule:
  #   - cron: '30 10 * * 1-6'
  workflow_dispatch:
    inputs:
      action:
        description: 'Acción a ejecutar'
        required: true
        default: 'supervision'
        type: choice
        options:
          - supervision
          - sandbox_test

permissions:
  contents: read

concurrency:
  group: "telemetry-dispatch"
  cancel-in-progress: false

jobs:
  dispatch-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r scripts/bot_telemetria/requirements.txt

      - name: Run Sandbox Test
        if: "${{ github.event.inputs.action == 'sandbox_test' }}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_AUTHORIZED_CHAT_ID: ${{ secrets.TELEGRAM_AUTHORIZED_CHAT_ID || '1143226405' }}
          GREEN_API_HOST: https://7107.api.greenapi.com
          GREEN_API_ID_INSTANCE: '710722725803'
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          WHATSAPP_TEST_CHAT_ID: '584121339426@c.us'
          WHATSAPP_PROD_GROUP_ID: '120363260007129331@g.us'
          WHATSAPP_TARGET_GROUP_NAME: 'SANESCA EQUIPO 💛💙❤️'
          NOTION_TOKEN: ${{ secrets.SANESCATOKEN || secrets.NOTION_TOKEN }}
          NOTION_RESUMEN_DB: '3aa868054e2781338d94de72d7fc0d23'
          NOTION_DASHBOARD_DB: '3c3868054e2781ffadd6c35fb3a40c03'
          SEMANAS_FALLBACK: '20'
          TZ_OFFSET_MIN: '240'
        run: |
          cd scripts/bot_telemetria
          python -c "from greenapi_client import green_client; from notion_client import get_today_report; rep = get_today_report(); res = green_client.send_sandbox_test(rep['whatsapp_text']); print('Sandbox result:', res)"

      - name: Run Morning Supervision & Dispatch (15 min Timeout)
        if: "${{ github.event_name == 'schedule' || github.event.inputs.action == 'supervision' }}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_AUTHORIZED_CHAT_ID: ${{ secrets.TELEGRAM_AUTHORIZED_CHAT_ID || '1143226405' }}
          GREEN_API_HOST: https://7107.api.greenapi.com
          GREEN_API_ID_INSTANCE: '710722725803'
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          WHATSAPP_TEST_CHAT_ID: '584121339426@c.us'
          WHATSAPP_PROD_GROUP_ID: '120363260007129331@g.us'
          WHATSAPP_TARGET_GROUP_NAME: 'SANESCA EQUIPO 💛💙❤️'
          NOTION_TOKEN: ${{ secrets.SANESCATOKEN || secrets.NOTION_TOKEN }}
          NOTION_RESUMEN_DB: '3aa868054e2781338d94de72d7fc0d23'
          NOTION_DASHBOARD_DB: '3c3868054e2781ffadd6c35fb3a40c03'
          SEMANAS_FALLBACK: '20'
          TZ_OFFSET_MIN: '240'
        run: |
          cd scripts/bot_telemetria
          python dispatch_workflow.py
